# Mỗi khi có code mới được push lên main (hoặc có pull request): chạy toàn bộ bài test.
# Nếu là push lên main và test qua, tự build bản React và đưa lên GitHub Pages.
name: Kiểm thử và triển khai

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # cho phép bấm chạy tay trên tab Actions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài các gói
        run: npm ci

      - name: Cài các gói của bản React
        run: npm ci --prefix app

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Build bản React và chạy test
        run: npm test

      # Nếu test đỏ, lưu lại báo cáo để xem chi tiết trên GitHub
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bao-cao-test
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    # Chỉ đưa lên mạng khi push lên main (hoặc bấm chạy tay), và chỉ khi test đã qua.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            prompt5/package-lock.json

      # VITE_BASE: trang nằm trong thư mục con của tên repo trên GitHub Pages
      - name: Build bản React
        run: |
          npm ci --prefix app
          VITE_BASE=/ban-va-toi/ npm --prefix app run build

      # Landing page nhà hàng (prompt5) nằm ở /ban-va-toi/prompt5/
      - name: Build prompt5
        run: |
          npm ci --prefix prompt5
          VITE_BASE=/ban-va-toi/prompt5/ npm --prefix prompt5 run build

      - name: Ghép trang web (bản React ở gốc, trang cũ giữ nguyên)
        run: bash scripts/build-site.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
