<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Đặt bàn - Bạn &amp; Tôi</title>
  <meta name="description" content="Đặt bàn trước tại quán cà phê Bạn &amp; Tôi: chọn ngày, giờ và số người, quán sẽ giữ chỗ cho bạn.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☕%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main" class="skip-link">Bỏ qua đến nội dung chính</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../prompt2/" class="logo">Bạn &amp; Tôi</a>

      <button class="nav-toggle" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Điều hướng chính">
        <ul>
          <li><a href="../prompt2/#hero">Trang chủ</a></li>
          <li><a href="../prompt2/#menu">Menu</a></li>
          <li><a href="#dat-ban" aria-current="page">Đặt bàn</a></li>
          <li><a href="../prompt2/#danh-gia">Đánh giá</a></li>
          <li><a href="../prompt2/#lien-he">Liên hệ</a></li>
          <li><a id="auth-link" href="admin.html">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="dat-ban" class="section">
      <div class="container">
        <h1>Đặt bàn</h1>
        <p class="lead">Mở cửa 9:00 - 22:00 hằng ngày. Chọn ngày, giờ và số người, quán sẽ giữ chỗ cho bạn.</p>

        <form class="contact-form" id="booking-form" novalidate>
          <div class="field">
            <label for="bk-name">Họ tên</label>
            <input id="bk-name" name="name" type="text" autocomplete="name" maxlength="100" required>
            <p class="field-error" id="bk-name-error" hidden></p>
          </div>
          <div class="field">
            <label for="bk-phone">Số điện thoại</label>
            <input id="bk-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>
            <p class="field-error" id="bk-phone-error" hidden></p>
          </div>
          <div class="field">
            <label for="bk-date">Ngày</label>
            <input id="bk-date" name="date" type="date" required>
            <p class="field-error" id="bk-date-error" hidden></p>
          </div>
          <div class="field">
            <label for="bk-time">Giờ</label>
            <select id="bk-time" name="time" required>
              <option value="">Chọn giờ</option>
            </select>
            <p class="field-error" id="bk-time-error" hidden></p>
          </div>
          <div class="field">
            <label for="bk-guests">Số người</label>
            <input id="bk-guests" name="guests" type="number" min="1" max="20" inputmode="numeric" value="2" required>
            <p class="field-error" id="bk-guests-error" hidden></p>
          </div>
          <fieldset class="field table-picker">
            <legend>Chọn bàn</legend>
            <div class="table-options" id="bk-tables"></div>
            <p class="table-hint" id="bk-table-hint">Chọn ngày, giờ và số người để xem bàn trống.</p>
            <p class="field-error" id="bk-table-error" hidden></p>
          </fieldset>
          <div class="field">
            <label for="bk-note">Ghi chú (không bắt buộc)</label>
            <textarea id="bk-note" name="note" rows="3" maxlength="500"></textarea>
            <p class="field-error" id="bk-note-error" hidden></p>
          </div>
          <button type="submit" class="btn">Đặt bàn</button>
          <p class="form-status" id="bk-status" role="status" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Bạn &amp; Tôi</div>
  </footer>

  <script src="config.js"></script>
  <script src="nav.js" defer></script>
  <script src="auth-link.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
